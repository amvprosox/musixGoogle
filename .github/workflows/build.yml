name: Build

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: build-${{ github.ref }}
  cancel-in-progress: true

jobs:
  ios:
    name: iOS (unsigned IPA for AltStore)
    runs-on: macos-15
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4

      - name: Select Xcode
        run: sudo xcode-select -s "$(ls -d /Applications/Xcode*.app | sort -V | tail -1)"

      - name: Show toolchain
        run: |
          xcodebuild -version
          swift --version

      - name: Core unit tests
        run: swift test --package-path ios/MusixCore

      - name: Install XcodeGen
        run: brew install xcodegen

      - name: Download the voice engine framework
        working-directory: ios
        run: |
          mkdir -p Frameworks
          curl -fsSL -o "$RUNNER_TEMP/sherpa.zip" https://github.com/k2-fsa/sherpa-onnx/releases/download/xcframework/sherpa-onnx-v2.0.1-ios-shared-onnxruntime-static.xcframework.zip
          echo "fc4c665e694322ced5393aafafaae6bb3e0a7449d98d5db60bc220ac7ac4cbc9  $RUNNER_TEMP/sherpa.zip" | shasum -a 256 -c
          unzip -q "$RUNNER_TEMP/sherpa.zip" -d Frameworks
          ls Frameworks

      - name: Generate the Xcode project
        working-directory: ios
        run: xcodegen generate

      - name: Build for iPhone
        working-directory: ios
        env:
          MUSIX_OPENROUTER_KEY: ${{ secrets.OPENROUTER_KEY }}
        run: |
          set -o pipefail
          mkdir -p build
          BUILTIN_AI=$(python3 -c 'import os,base64;k=os.environ.get("MUSIX_OPENROUTER_KEY","").encode();m=b"musix-voice";print(base64.b64encode(bytes(b^m[i%len(m)] for i,b in enumerate(k))).decode())')
          xcodebuild \
            -project Musix.xcodeproj \
            -scheme Musix \
            -configuration Release \
            -sdk iphoneos \
            -destination 'generic/platform=iOS' \
            -derivedDataPath build \
            CODE_SIGNING_ALLOWED=NO \
            CODE_SIGNING_REQUIRED=NO \
            CODE_SIGN_IDENTITY="" \
            MUSIX_BUILTIN_AI="$BUILTIN_AI" \
            build | tee build/xcodebuild.log

      - name: Package the IPA
        working-directory: ios
        run: |
          rm -rf Payload Musix-unsigned.ipa
          mkdir Payload
          cp -R build/Build/Products/Release-iphoneos/Musix.app Payload/
          zip -qry Musix-unsigned.ipa Payload
          ls -la Musix-unsigned.ipa

      - uses: actions/upload-artifact@v4
        with:
          name: Musix-iOS-unsigned-ipa
          path: ios/Musix-unsigned.ipa
          if-no-files-found: error

      - uses: actions/upload-artifact@v4
        if: failure()
        with:
          name: ios-build-log
          path: ios/build/xcodebuild.log
          if-no-files-found: ignore

  android:
    name: Android (phone and car APKs)
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'

      - name: Download the voice engine library
        run: |
          mkdir -p android/app/libs
          curl -fsSL -o android/app/libs/sherpa-onnx-2.0.1.aar https://github.com/k2-fsa/sherpa-onnx/releases/download/v2.0.1/sherpa-onnx-2.0.1.aar
          echo "a8d09d1d32f3eb8520482c6d3d43fae674681c5b050385967c70a3c2c9bf0ee7  android/app/libs/sherpa-onnx-2.0.1.aar" | sha256sum -c

      - name: Check, test, and build
        working-directory: android
        env:
          MUSIX_OPENROUTER_KEY: ${{ secrets.OPENROUTER_KEY }}
        run: ./gradlew --no-daemon ktlintCheck test lintMobileDebug lintAutomotiveDebug assembleMobileRelease assembleAutomotiveRelease -Pmusix.signWithDebugKey=true

      - name: Name the APKs
        run: |
          mkdir -p apk
          cp android/app/build/outputs/apk/mobile/release/app-mobile-release.apk apk/Musix-android-phone.apk
          cp android/app/build/outputs/apk/automotive/release/app-automotive-release.apk apk/Musix-android-automotive.apk

      - uses: actions/upload-artifact@v4
        with:
          name: Musix-Android-APKs
          path: apk/*.apk
          if-no-files-found: error

      - uses: actions/upload-artifact@v4
        if: failure()
        with:
          name: android-reports
          path: |
            android/app/build/reports
            android/core/build/reports
          if-no-files-found: ignore

  windows:
    name: Windows (installer and portable)
    runs-on: windows-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Build shared packages
        run: |
          npm run build -w @musix/design
          npm run build -w @musix/bridge

      - name: Typecheck and unit tests
        run: |
          npm run typecheck -w musix
          npm test -w musix

      - name: Build the installer
        run: npm run dist:win -w musix
        env:
          MUSIX_OPENROUTER_KEY: ${{ secrets.OPENROUTER_KEY }}
          CSC_IDENTITY_AUTO_DISCOVERY: 'false'

      - uses: actions/upload-artifact@v4
        with:
          name: Musix-Windows
          path: |
            desktop/release/Musix-Setup-*.exe
            desktop/release/Musix-Portable-*.exe
          if-no-files-found: error

  linux:
    name: Ubuntu (deb and AppImage)
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Build shared packages
        run: |
          npm run build -w @musix/design
          npm run build -w @musix/bridge

      - name: Typecheck and unit tests
        run: |
          npm run typecheck -w musix
          npm test -w musix

      - name: Build the packages
        run: npm run dist -w musix
        env:
          MUSIX_OPENROUTER_KEY: ${{ secrets.OPENROUTER_KEY }}

      - uses: actions/upload-artifact@v4
        with:
          name: Musix-Linux
          path: |
            desktop/release/*.deb
            desktop/release/*.AppImage
          if-no-files-found: error

  macos:
    name: macOS (dmg and zip)
    runs-on: macos-15
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Build shared packages
        run: |
          npm run build -w @musix/design
          npm run build -w @musix/bridge

      - name: Typecheck and unit tests
        run: |
          npm run typecheck -w musix
          npm test -w musix

      - name: Add the Intel voice engine for the universal app
        run: |
          npm pack sherpa-onnx-darwin-x64@2.0.1 --silent
          mkdir -p node_modules/sherpa-onnx-darwin-x64
          tar xzf sherpa-onnx-darwin-x64-2.0.1.tgz -C node_modules/sherpa-onnx-darwin-x64 --strip-components=1
          rm sherpa-onnx-darwin-x64-2.0.1.tgz

      - name: Build the app
        run: npm run dist:mac -w musix
        env:
          MUSIX_OPENROUTER_KEY: ${{ secrets.OPENROUTER_KEY }}
          CSC_IDENTITY_AUTO_DISCOVERY: 'false'

      - uses: actions/upload-artifact@v4
        with:
          name: Musix-macOS
          path: |
            desktop/release/Musix-*-mac.dmg
            desktop/release/Musix-*-mac.zip
          if-no-files-found: error
